; ==============================================================
; BASIC++ Configuration File  (basicpp.cfg)
; ==============================================================
;
; Windows 11 configuration file for the BASIC++ interpreter.
; Place in the current directory or %USERPROFILE%.
;
; File names by platform:
;   Linux/macOS:  baspp.cfg (executable: baspp)
;   Windows:      basicpp.cfg (executable: basicpp.exe)
;   FreeDOS:      bpp.cfg (executable: bpp.exe)
;
; PRIORITY (lowest to highest):
;   1. Settings in this file
;   2. Command-line switches  (-d GWBS, -S, -s STANDARD)
;   3. Runtime commands        (DIALECT, OPTION STRICT, SECURITY)
;
; Lines starting with ; or # are comments.
; Keys are case-insensitive. Unknown keys are ignored.
; ==============================================================

; --------------------------------------------------------------
; DIALECT
; --------------------------------------------------------------
; Set the default BASIC dialect.
;
; Available: PATB EC55 E116 GWBS QBAS TRS1 TRS2 C64B MSBR
;            SBAS QLSB APPB
;
; Default: GWBS
;
; dialect = E116

; --------------------------------------------------------------
; SECURITY
; --------------------------------------------------------------
; OPEN | STANDARD | RESTRICTED
; Default: OPEN
;
; security = OPEN

; --------------------------------------------------------------
; STRICT
; --------------------------------------------------------------
; ON = only active dialect's keywords.  OFF = all keywords.
; Default: OFF
;
; strict = OFF

; --------------------------------------------------------------
; QUIET
; --------------------------------------------------------------
; ON = suppress startup banner.  OFF = show banner.
; Default: OFF
;
; quiet = OFF

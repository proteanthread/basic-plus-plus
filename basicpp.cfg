# ==============================================================
#  BASIC++ 4.0.0 (Stable) — basicpp.cfg (Windows 11)
# ==============================================================
#
#  Place in any of these locations (layered merge, later wins):
#    1. %APPDATA%\basicpp\basicpp.cfg   (user roaming config)
#    2. %USERPROFILE%\basicpp.cfg       (home directory)
#    3. .\basicpp.cfg                   (project-local override)
#
#  PRIORITY (lowest to highest):
#    1. Most-general config file found
#    2. Most-specific config file found (overrides earlier)
#    3. Command-line switches  (-d, -S, -s, -q, etc.)
#    4. Runtime commands       (DIALECT, SECURITY, OPTION, etc.)
#
#  FORMAT: YAML (key: value with indentation, or flat dotted keys)
#    Both forms are equivalent:
#      dialect:
#        separator: ":"       # indented section form
#      dialect.separator: ":" # flat dotted key form
#
#  Comments start with # or ;
#  Boolean values: on/off, yes/no, true/false, 1/0
# ==============================================================


# --------------------------------------------------------------
#  Dialect
# --------------------------------------------------------------
# Primary dialect (or comma-separated for mixed mode).
# Available: PATB, TRS1, TRS2, GWBS, EC55, E116, QBAS, AINT,
#            ASFT, ATAR, C64B, COCO, MBAS, SINC, SQLB, SUPB

dialect = GWBS,SUPB,E116

# Strict mode: only active dialect keywords accepted
strict = off


# --------------------------------------------------------------
#  Dialect Personality
# --------------------------------------------------------------
# Override dialect-inherited defaults for custom profiles,
# retro accuracy, hybrid configs, or future-proofing on
# devices not yet imagined.

dialect:
  # Statement separator — PATB: ";"  all others: ":"
  # separator: ":"

  # Maximum valid line number
  # PATB: 32767  GWBS: 65529  C64B: 63999  ECMA: 99999
  # max_line: 65529

  # NOT-EQUAL operator — on: # is <>   off: <> only
  # hash_neq: off

  # Language feature toggles
  # has_then: on              # IF requires THEN keyword
  # let_optional: on          # LET keyword can be omitted
  # has_for_next: on          # FOR/NEXT loops
  # has_string_vars: on       # String variables (A$)
  # has_print_hash: on        # PRINT # file channels
  # has_array_at: off          # @() Atari-style array syntax
  # has_rnd: on               # RND() function
  # has_abs: on               # ABS() function
  # has_size: on              # SIZE (free memory) function
  # has_data_read: on         # DATA/READ/RESTORE
  # has_while_wend: on        # WHILE/WEND loops
  # has_do_loop: on           # DO...LOOP WHILE/UNTIL
  # has_extended_vars: on     # Named vars beyond A-Z
  # has_merge_chain: on       # MERGE/CHAIN commands
  # has_float: on             # Floating-point arithmetic
  # has_dim_arrays: on        # DIM arrays
  # has_string_functions: on  # LEFT$/MID$/RIGHT$/LEN
  # has_on_error: on          # ON ERROR GOTO
  # has_cls: on               # CLS command
  # has_tron_troff: on        # TRON/TROFF debugging


# --------------------------------------------------------------
#  Prompt
# --------------------------------------------------------------
prompt:
  # Ready prompt text — overrides dialect default
  # PATB: "READY"  GWBS: "Ok"  C64B: "READY."  QBAS: ""
  # ready: "Ok"

  # PRINT zone width (comma-separated column spacing)
  # GWBS: 14  C64B: 10  PATB: 8  ECMA: 14
  # zone_width: 14


# --------------------------------------------------------------
#  Security
# --------------------------------------------------------------
# Sandbox level for file I/O, shell, network, memory, devices.
#   OPEN        — no restrictions (developer mode)
#   SAFE        — secure but functional
#   STANDARD    — controlled sandbox, limited I/O
#   EDUCATIONAL — classroom mode, file I/O, no net/mem
#   RESTRICTED  — very limited, CHAIN/MERGE, no file write
#   PARANOID    — pure computation only

security = OPEN

# Granular operation restrictions (one-way ratchet, cannot undo).
# Available ops: FILE_READ, FILE_WRITE, FILE_MGMT, FILE_BLOCK,
#   FILE_STREAM, COMPILE, CHAIN, SYSTEM, MODULE, USB, VDEV,
#   VTERM, VCON, EVAL, NETWORK, MEM_READ, MEM_WRITE,
#   PROG_MGMT, EXT_LOAD

restrict:
  op:
    # SYSTEM: on
    # NETWORK: on
    # USB: on
    # MEM_WRITE: on
    # EVAL: on
  keyword:
    # SHELL: on
    # KILL: on
    # POKE: on

# Security sub-system overrides
# security:
#   path_validation: on
#   port_policy: on
#   memory_bounds: on


# --------------------------------------------------------------
#  Display & Video
# --------------------------------------------------------------
quiet = off                    # Suppress startup banner

display:
  color: on                   # ANSI 16-color (off = monochrome)
  cga: off                    # CGA fast screen updates (DOS only)
  hires: off                  # Maximum terminal lines
  no_high: off                # Disable bright colors 8-15
  # columns: 80              # Override auto-detected width
  # rows: 25                 # Override auto-detected height


# --------------------------------------------------------------
#  Memory & Math
# --------------------------------------------------------------
math:
  double: off                 # 64-bit double precision
  mbf: off                    # Microsoft Binary Format compat

memory:
  dynamic: off                # Allow > 64KB structures
  block: off                  # Preallocate pools at startup
  # high: 65535               # Top of BASIC memory (bytes)
  # workspace: 32768          # Scratch workspace pool (bytes)


# --------------------------------------------------------------
#  I/O & Devices
# --------------------------------------------------------------
io:
  files: 3                    # Max open files (1-255)
  com_buffer: 256             # RS-232 receive buffer (bytes)
  record_length: 128          # RANDOM file record length (bytes)
  keyboard_remap: off         # Full keyboard remapping
  break: on                   # Ctrl+Break stops program

features:
  extended: off               # Enable all BASIC++ extensions


# --------------------------------------------------------------
#  Keyword System
# --------------------------------------------------------------
keyword:
  case: UPPER                 # LIST output: UPPER/LOWER/TITLE/MIXED

  # Per-keyword properties:
  # PRINT:
  #   UPPERCASE: on
  #   PREFIX: ">>> "
  # INPUT:
  #   PROMPT: "? "
  # GOTO:
  #   STRICT: on


# --------------------------------------------------------------
#  Aliases
# --------------------------------------------------------------
# Map custom names to existing keywords.
# alias:
#   MOSTRAR: PRINT           # Spanish
#   ENTRADA: INPUT
#   SI: IF
#   ENTONCES: THEN
#   PARA: FOR
#   SIGUIENTE: NEXT
#   MIENTRAS: WHILE
#   FIN: END
#   P: PRINT                 # Shortcuts
#   L: LIST
#   R: RUN


# --------------------------------------------------------------
#  Overrides
# --------------------------------------------------------------
# Change parser interpretation without modifying stored source.
# override:
#   PRINT: "PRINT TAB(7);"
#   INPUT: "INPUT \"? \";"


# --------------------------------------------------------------
#  Scope Hooks
# --------------------------------------------------------------
# Block or intercept specific keywords.
# scope:
#   SHELL: BLOCK
#   KILL: BLOCK
#   SYSTEM: BLOCK
#   POKE: BLOCK


# --------------------------------------------------------------
#  Module & Library Auto-Loading
# --------------------------------------------------------------
module:
  # autoload: MATH, STRING   # Modules to activate at startup

lib:
  # path: "C:\\Users\\me\\basicpp\\lib;.\\lib"   # Search path
  # external: mylib.dll       # External shared library

# lib: GAME.LIB              # Library file to include
# mod:
#   external: custom_module   # External module
# func:
#   external: my_function     # External function

include:
  # path: "C:\\Users\\me\\basicpp\\include;.\\include"


# --------------------------------------------------------------
#  Startup
# --------------------------------------------------------------
startup:
  # run: autoexec.bas         # Auto-run program (like --run)
  # load: myprogram.bas       # Auto-load program (like --load)
  # list: myprogram.bas       # Auto-list and exit (like --list)
  # dry_run: test.bas         # Step-mode run (like --dry-run)
  # edit: off                 # Start in editor (like --edit)
  # command: "PRINT 42"       # Batch command (like -c)
  # command_string: "/debug"  # COMMAND$ value (like --cmd)


# --------------------------------------------------------------
#  Diagnostics
# --------------------------------------------------------------
debug: off                    # Verbose errors and diagnostics
boot_log: off                 # Print boot sequence log
verbose: off                  # Execution tracing (every statement)


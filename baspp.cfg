; ==============================================================
; BASIC++ Configuration File  (baspp.cfg)
; ==============================================================
;
; This file sets default options for the BASIC++ interpreter.
; Place it in the current directory or your home directory.
;
; File names by platform:
;   Linux/macOS:  baspp.cfg
;   Windows:      basicpp.cfg
;   FreeDOS:      bpp.cfg
;
; PRIORITY (lowest to highest):
;   1. Settings in this file
;   2. Command-line switches  (-d GWBS, -S, -s STANDARD)
;   3. Runtime commands        (DIALECT, OPTION STRICT, SECURITY)
;
; Lines starting with ; or # are comments.
; Keys are case-insensitive. Unknown keys are ignored.
; ==============================================================

; --------------------------------------------------------------
; DIALECT
; --------------------------------------------------------------
; Set the default BASIC dialect. This controls which keywords
; are recognized, how arrays and strings behave, and which
; functions are available.
;
; Available dialects:
;   PATB  - Palo Alto Tiny BASIC  (ultra-minimal, 2K)
;   EC55  - ECMA-55 Minimal BASIC (standard conforming)
;   E116  - ECMA-116 Full BASIC   (extended standard)
;   GWBS  - GW-BASIC / BASICA     (IBM PC classic)
;   QBAS  - QBasic / QuickBASIC   (Microsoft structured)
;   TRS1  - TRS-80 Level I BASIC  (Radio Shack)
;   TRS2  - TRS-80 Level II BASIC (Radio Shack extended)
;   C64B  - Commodore 64 BASIC V2 (CBM classic)
;   MSBR  - MSX-BASIC             (MSX standard)
;   SBAS  - Sinclair BASIC        (ZX Spectrum)
;   QLSB  - SuperBASIC            (Sinclair QL)
;   APPB  - Applesoft BASIC       (Apple II)
;
; Default: PATB (Palo Alto Tiny BASIC)
;
; dialect = GWBS

; --------------------------------------------------------------
; SECURITY
; --------------------------------------------------------------
; Set the security level. This controls which operations the
; interpreter allows (file I/O, system commands, etc.).
;
;   OPEN       - All operations permitted (default)
;   STANDARD   - File I/O allowed, SYSTEM command blocked
;   RESTRICTED - No file I/O, no SYSTEM, no BSAVE/BLOAD
;
; Default: OPEN
;
; security = OPEN

; --------------------------------------------------------------
; STRICT
; --------------------------------------------------------------
; Enable strict dialect mode. When ON, only keywords that belong
; to the active dialect are accepted. Keywords from other dialects
; raise a WHAT? error.
;
; When OFF (default), all keywords from all dialects are accepted
; (union mode). This is the most user-friendly setting.
;
;   ON  - Only the active dialect's keywords
;   OFF - All keywords from all dialects (default)
;
; strict = OFF

; --------------------------------------------------------------
; QUIET
; --------------------------------------------------------------
; Suppress the startup banner (version, copyright, build date).
; Useful for scripted/batch usage with the -c flag.
;
;   ON  - No banner at startup
;   OFF - Print the full banner (default)
;
; quiet = OFF

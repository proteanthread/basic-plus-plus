# ==============================================================
#  BASIC++ 4.0.0 (Stable) — baspp.cfg (Linux)
# ==============================================================
#
#  Layered merge — all found files parsed, later wins:
#    1. /etc/baspp.cfg                  (system-wide defaults)
#    2. ~/.config/baspp/baspp.cfg       (XDG user config)
#    3. ~/.baspp.cfg                    (home directory fallback)
#    4. ./baspp.cfg                     (project-local override)
#
#  PRIORITY (lowest to highest):
#    1. Most-general config file found
#    2. Most-specific config file found (overrides earlier)
#    3. Command-line switches  (-d, -S, -s, -q, etc.)
#    4. Runtime commands       (DIALECT, SECURITY, OPTION, etc.)
#
#  FORMAT: YAML (key: value with indentation, or flat dotted keys)
#  Comments start with # or ;
#  Boolean values: on/off, yes/no, true/false, 1/0
# ==============================================================


# --------------------------------------------------------------
#  Dialect
# --------------------------------------------------------------
# Primary dialect or comma-separated for mixed mode.
# Available: PATB, TRS1, TRS2, GWBS, EC55, E116, QBAS, AINT,
#            ASFT, ATAR, C64B, COCO, MBAS, SINC, SQLB, SUPB

dialect = GWBS,SUPB,E116

# Strict mode: only active dialect keywords accepted
strict = off


# --------------------------------------------------------------
#  Dialect Personality
# --------------------------------------------------------------
# Override dialect-inherited defaults for custom profiles,
# retro accuracy, hybrid configs, or future-proofing on
# devices not yet imagined.

dialect:
  # separator: ":"            # Statement separator
  # max_line: 65529           # Max line number
  # hash_neq: off             # # as not-equal operator
  # has_then: on              # IF requires THEN
  # let_optional: on          # LET keyword optional
  # has_for_next: on          # FOR/NEXT loops
  # has_string_vars: on       # String variables (A$)
  # has_print_hash: on        # PRINT # file channels
  # has_array_at: off          # @() Atari-style arrays
  # has_rnd: on               # RND() function
  # has_abs: on               # ABS() function
  # has_size: on              # SIZE function
  # has_data_read: on         # DATA/READ/RESTORE
  # has_while_wend: on        # WHILE/WEND loops
  # has_do_loop: on           # DO...LOOP
  # has_extended_vars: on     # Named vars beyond A-Z
  # has_merge_chain: on       # MERGE/CHAIN
  # has_float: on             # Floating-point math
  # has_dim_arrays: on        # DIM arrays
  # has_string_functions: on  # LEFT$/MID$/RIGHT$/LEN
  # has_on_error: on          # ON ERROR GOTO
  # has_cls: on               # CLS command
  # has_tron_troff: on        # TRON/TROFF


# --------------------------------------------------------------
#  Prompt
# --------------------------------------------------------------
prompt:
  # ready: "Ok"               # Override dialect default
  # zone_width: 14            # PRINT comma column spacing


# --------------------------------------------------------------
#  Security
# --------------------------------------------------------------
#   OPEN / SAFE / STANDARD / EDUCATIONAL / RESTRICTED / PARANOID

security = OPEN

restrict:
  op:
    # SYSTEM: on
    # NETWORK: on
    # USB: on
    # MEM_WRITE: on
    # EVAL: on
  keyword:
    # SHELL: on
    # KILL: on
    # POKE: on

# security:
#   path_validation: on
#   port_policy: on
#   memory_bounds: on


# --------------------------------------------------------------
#  Display & Video
# --------------------------------------------------------------
quiet = off

display:
  color: on                   # ANSI 16-color
  cga: off                    # CGA fast mode (not typical)
  hires: on                   # Max terminal lines
  no_high: off                # Dim palette only
  # columns: 80              # Override terminal auto-detect
  # rows: 25


# --------------------------------------------------------------
#  Memory & Math
# --------------------------------------------------------------
math:
  double: off
  mbf: off

memory:
  dynamic: off
  block: off
  # high: 65535
  # workspace: 32768


# --------------------------------------------------------------
#  I/O & Devices
# --------------------------------------------------------------
io:
  files: 10                   # Linux can handle many descriptors
  com_buffer: 1024            # /dev/ttyS0, /dev/ttyUSB0
  record_length: 256
  keyboard_remap: off
  break: on

features:
  extended: off


# --------------------------------------------------------------
#  Keyword System
# --------------------------------------------------------------
keyword:
  case: UPPER

  # Per-keyword properties:
  # PRINT:
  #   UPPERCASE: on
  #   PREFIX: ">>> "
  # INPUT:
  #   PROMPT: "? "


# --------------------------------------------------------------
#  Aliases
# --------------------------------------------------------------
# alias:
#   MOSTRAR: PRINT
#   ENTRADA: INPUT
#   SI: IF
#   ENTONCES: THEN
#   PARA: FOR
#   SIGUIENTE: NEXT
#   FIN: END
#   P: PRINT
#   L: LIST
#   R: RUN


# --------------------------------------------------------------
#  Overrides
# --------------------------------------------------------------
# override:
#   PRINT: "PRINT TAB(7);"
#   INPUT: "INPUT \"? \";"


# --------------------------------------------------------------
#  Scope Hooks
# --------------------------------------------------------------
# scope:
#   SHELL: BLOCK
#   KILL: BLOCK


# --------------------------------------------------------------
#  Module & Library Auto-Loading
# --------------------------------------------------------------
module:
  # autoload: MATH, STRING

lib:
  # path: "/usr/share/baspp/lib:~/.baspp/lib:./lib"
  # external: libmymod.so

# lib: GAME.LIB
# mod:
#   external: custom_module
# func:
#   external: my_function

include:
  # path: "/usr/share/baspp/include:./include"


# --------------------------------------------------------------
#  Startup
# --------------------------------------------------------------
startup:
  # run: autoexec.bas
  # load: myprogram.bas
  # list: myprogram.bas
  # dry_run: test.bas
  # edit: off
  # command: "PRINT 42"
  # command_string: "/debug"


# --------------------------------------------------------------
#  Diagnostics
# --------------------------------------------------------------
debug: off
boot_log: off
verbose: off

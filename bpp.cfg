# ==============================================================
#  BASIC++ 4.0.0 (Stable) — BPP.CFG (FreeDOS)
# ==============================================================
#
#  FreeDOS: 8.3 filenames, limited memory, real-mode DOS.
#
#  Layered merge — all found files parsed, later wins:
#    1. C:\BPP\BPP.CFG                 (install directory)
#    2. .\BPP.CFG                      (project-local override)
#
#  PRIORITY (lowest to highest):
#    1. Most-general config file found
#    2. Most-specific config file found (overrides earlier)
#    3. Command-line switches  (-d, -S, -s, -q, etc.)
#    4. Runtime commands       (DIALECT, SECURITY, OPTION, etc.)
#
#  FORMAT: YAML (key: value with indentation, or flat dotted keys)
#  Comments start with # or ;
#  Boolean values: on/off, yes/no, true/false, 1/0
# ==============================================================


# --------------------------------------------------------------
#  Dialect
# --------------------------------------------------------------
# GW-BASIC + QBasic — the native DOS combination.
# Available: PATB, TRS1, TRS2, GWBS, EC55, E116, QBAS, AINT,
#            ASFT, ATAR, C64B, COCO, MBAS, SINC, SUPA, SBAS

dialect: GWBS,QBAS

# Strict mode — ON for authentic DOS behavior
strict: on


# --------------------------------------------------------------
#  Dialect Personality
# --------------------------------------------------------------
# Override dialect defaults. Useful for targeting specific
# DOS-era hardware configurations or preserving dialects
# for retro computing projects.

dialect:
  # separator: ":"
  # max_line: 65529
  # hash_neq: off
  # has_then: on
  # let_optional: on
  # has_for_next: on
  # has_string_vars: on
  # has_print_hash: on
  # has_array_at: off
  # has_rnd: on
  # has_abs: on
  # has_size: on
  # has_data_read: on
  # has_while_wend: on
  # has_do_loop: on
  # has_extended_vars: on
  # has_merge_chain: on
  # has_float: on
  # has_dim_arrays: on
  # has_string_functions: on
  # has_on_error: on
  # has_cls: on
  # has_tron_troff: on


# --------------------------------------------------------------
#  Prompt
# --------------------------------------------------------------
prompt:
  # ready: "Ok"
  # zone_width: 14


# --------------------------------------------------------------
#  Security
# --------------------------------------------------------------
#   OPEN / SAFE / STANDARD / EDUCATIONAL / RESTRICTED / PARANOID

security: STANDARD

restrict:
  op:
    # NETWORK: on             # No network on DOS
    # USB: on                 # Unless USB module loaded
  keyword:
    # SHELL: on

# security:
#   path_validation: on
#   port_policy: on
#   memory_bounds: on


# --------------------------------------------------------------
#  Display & Video
# --------------------------------------------------------------
quiet: off

display:
  color: on                   # CGA/EGA/VGA color
  cga: on                     # Direct CGA memory writes
  hires: off                  # Standard 25-line mode
  no_high: off                # Full 16-color palette
  # columns: 80
  # rows: 25


# --------------------------------------------------------------
#  Memory & Math
# --------------------------------------------------------------
math:
  double: off                 # Save memory on 16-bit
  mbf: on                     # Microsoft Binary Format for DOS

memory:
  dynamic: off                # Fixed arrays, 64KB limit
  block: on                   # Preallocate for DOS performance
  # high: 65535               # Top of BASIC memory
  # workspace: 32768          # Scratch pool


# --------------------------------------------------------------
#  I/O & Devices
# --------------------------------------------------------------
io:
  files: 3                    # DOS file handle limit
  com_buffer: 128             # Small buffer for DOS COM ports
  record_length: 128          # Classic RANDOM file record
  keyboard_remap: off
  break: on                   # Ctrl+Break handling

features:
  extended: off


# --------------------------------------------------------------
#  Keyword System
# --------------------------------------------------------------
keyword:
  case: UPPER

  # Per-keyword properties:
  # PRINT:
  #   UPPERCASE: on
  # INPUT:
  #   PROMPT: "? "


# --------------------------------------------------------------
#  Aliases
# --------------------------------------------------------------
# alias:
#   P: PRINT
#   L: LIST
#   R: RUN


# --------------------------------------------------------------
#  Overrides
# --------------------------------------------------------------
# override:
#   PRINT: "PRINT TAB(7);"


# --------------------------------------------------------------
#  Scope Hooks
# --------------------------------------------------------------
# scope:
#   SHELL: BLOCK


# --------------------------------------------------------------
#  Module & Library Auto-Loading
# --------------------------------------------------------------
module:
  # autoload: MATH, STRING

lib:
  # path: "C:\\BPP\\LIB;.\\LIB"
  # external: MYLIB.DLL

# lib: GAME.LIB
# mod:
#   external: CUSTOM
# func:
#   external: MYFUNC

include:
  # path: "C:\\BPP\\INC;.\\INC"


# --------------------------------------------------------------
#  Startup
# --------------------------------------------------------------
startup:
  # run: AUTOEXEC.BAS         # Auto-run at boot
  # load: MYPROG.BAS
  # list: MYPROG.BAS
  # dry_run: TEST.BAS
  # edit: off
  # command: "PRINT 42"
  # command_string: "/S"


# --------------------------------------------------------------
#  Diagnostics
# --------------------------------------------------------------
debug: off
boot_log: off
verbose: off
